services:
  sementsov-frontend:
    build: .
    container_name: sementsov-frontend
    restart: unless-stopped
    environment:
      - SMTP_HOST=192.168.1.12
      - SMTP_PORT=25
      - SMTP_USER=
      - SMTP_PASS=
      - SMTP_FROM=v.sementsov@sementsov.ru
    volumes:
      - sementsov-data:/app/data
    networks:
      - pustoshilov-lawyer_default

volumes:
  sementsov-data:

networks:
  pustoshilov-lawyer_default:
    external: true
